name: 機能提案
description: Kotoba Guard の機能改善を提案する
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どの入力・サイト・利用場面で困っているか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する挙動
      description: 期待する UI、検出、設定、権限の変更
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: プライバシーへの影響
      options:
        - 外部通信・入力保存・新しい権限を必要としない
        - 検討が必要
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・補足
