[project]
name = "kotoba-guard-models"
version = "0.1.0"
description = "Reproducible model validation and conversion tools for Kotoba Guard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kotoba Guard contributors" }]
dependencies = [
    "huggingface-hub>=1.5,<3.0",
    "numpy>=2.1,<3",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "onnxconverter-common>=1.14,<2",
    "safetensors>=0.4,<1",
    "sentencepiece>=0.2,<1",
    "torch>=2.6,<3",
    "transformers>=5.15.1,<6",
    "onnxscript>=0.2,<1",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["scripts"]
parallel = true

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
skip_empty = true
precision = 2

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
